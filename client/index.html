<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech News Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Newsreader:wght@600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4619398ece.js" crossorigin="anonymous"></script>
    <script defer src="./js/script.js"></script>
  </head>
  <body>
    <header>
        <nav>
            <ul class="nav-icons">
                <li>
                  <button id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
                    <i class="fa-solid fa-bars"></i>
                  </button>
                </li>
                <li>
                  <button id="search" aria-label="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                  </button>
                </li>
            </ul>
            <p>Tech News Dashboard</p>
            <i class="fa-solid fa-user"></i>
        </nav>
    </header>

    <aside id="sidebar" class="sidebar">
      <button id="close-menu" aria-label="Close menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <nav class="sidebar-nav">
        <button id="news">News Feed</button>
        <button id="ask">Ask HN</button>
        <button id="show">Show HN</button>
        <button id="job">Jobs</button>
      </nav>
    </aside>

    <main>
      <div class="sort">
        <p>Sort by: </p>
        <div class="sort-buttons">
          <button id="top" class="active" type="button">Top</button>
          <button id="best" type="button">Best</button>
          <button id="new" type="button">New</button>
        </div>
      </div>

      <div class="stories"></div>
    </main>
  </body>
</html>
